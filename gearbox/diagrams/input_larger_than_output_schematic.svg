<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#111}.t{font-size:22px;font-weight:700}.l{font-size:14px;font-weight:700}.s{font-size:12px}
      .w{stroke:#111;stroke-width:1.5;fill:none;marker-end:url(#a)}.c{stroke:#111;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
      .p,.r,.b,.g,.q{fill:#fff;stroke:#111;stroke-width:1.4}.m{fill:#fff;stroke:#111;stroke-width:1.4}
      .boundary{fill:none;stroke:#111;stroke-width:1.4}.divider{stroke:#111;stroke-width:1.1}
    </style>
  </defs>
  <rect width="1100" height="520" fill="#fff"/>
  <text x="32" y="38" class="t">INPUT_DATA_WIDTH &gt; OUTPUT_DATA_WIDTH: unpack-mode schematic</text>
  <rect x="25" y="58" width="1050" height="410" class="boundary"/>
  <line x1="25" y1="215" x2="1075" y2="215" class="divider"/>
  <text x="42" y="78" class="s">datapath</text>
  <text x="42" y="235" class="s">control</text>

  <rect x="35" y="92" width="130" height="62" class="p"/><text x="55" y="120" class="l">input stream</text><text x="55" y="142" class="s">valid/wide data</text>
  <polygon points="235,80 315,123 235,166" class="m"/><text x="251" y="118" class="l">lane</text><text x="249" y="137" class="l">mux</text>
  <rect x="390" y="70" width="210" height="108" class="b"/><text x="430" y="103" class="l">unpack buffer</text><text x="428" y="127" class="s">unpack_buffer_data_q</text><text x="428" y="148" class="s">alternating write lanes</text>
  <polygon points="670,80 750,123 670,166" class="m"/><text x="686" y="118" class="l">read</text><text x="684" y="137" class="l">mux</text>
  <rect x="815" y="78" width="170" height="90" class="r"/><text x="855" y="110" class="l">output stage</text><text x="842" y="134" class="s">valid_q, data_q</text>
  <rect x="1020" y="92" width="70" height="62" class="p"/><text x="1031" y="120" class="l">output</text><text x="1028" y="142" class="s">valid/data</text>

  <path d="M165 123 L235 123" class="w"/><path d="M315 123 L390 123" class="w"/><path d="M600 123 L670 123" class="w"/>
  <path d="M750 123 L815 123" class="w"/><path d="M985 123 L1020 123" class="w"/>

  <rect x="85" y="255" width="150" height="68" class="g"/><text x="119" y="284" class="l">ready logic</text><text x="106" y="305" class="s">free bytes &gt;= input</text>
  <rect x="285" y="255" width="142" height="68" class="r"/><text x="322" y="284" class="l">input lane</text><text x="318" y="305" class="s">toggles on beat</text>
  <rect x="490" y="240" width="174" height="86" class="r"/><text x="527" y="270" class="l">byte counter</text><text x="515" y="293" class="s">stored + add - remove</text>
  <rect x="725" y="240" width="174" height="86" class="r"/><text x="763" y="270" class="l">read pointer</text><text x="753" y="293" class="s">+ OUTPUT bytes</text>
  <polygon points="945,248 1025,288 945,328" class="q"/><text x="960" y="282" class="l">count</text><text x="959" y="301" class="l">&gt;= OUT</text>

  <rect x="490" y="395" width="145" height="54" class="g"/><text x="525" y="426" class="l">free bytes</text>
  <rect x="815" y="395" width="170" height="54" class="g"/><text x="855" y="426" class="l">stage ready</text>

  <path d="M356 255 L275 166" class="c"/><path d="M577 240 L577 178" class="c"/><path d="M812 240 L710 166" class="c"/>
  <path d="M664 288 L725 288" class="c"/><path d="M899 288 L945 288" class="c"/><path d="M1025 288 L1055 288 L1055 154" class="c"/>
  <path d="M562 395 L235 395 L235 289" class="c"/><path d="M900 395 L900 168" class="c"/>
  <text x="35" y="486" class="s">Solid arrows are data flow. Dashed arrows are ready/valid, pointer, and counter control.</text>
</svg>

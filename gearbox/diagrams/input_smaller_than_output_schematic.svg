<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#111}.t{font-size:22px;font-weight:700}.l{font-size:14px;font-weight:700}.s{font-size:12px}
      .w{stroke:#111;stroke-width:1.5;fill:none;marker-end:url(#a)}.c{stroke:#111;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
      .p,.r,.b,.g,.q{fill:#fff;stroke:#111;stroke-width:1.4}.m{fill:#fff;stroke:#111;stroke-width:1.4}
      .boundary{fill:none;stroke:#111;stroke-width:1.4}.divider{stroke:#111;stroke-width:1.1}
    </style>
  </defs>
  <rect width="1100" height="520" fill="#fff"/>
  <text x="32" y="38" class="t">INPUT_DATA_WIDTH &lt; OUTPUT_DATA_WIDTH: pack-mode schematic</text>
  <rect x="25" y="58" width="1050" height="410" class="boundary"/>
  <line x1="25" y1="215" x2="1075" y2="215" class="divider"/>
  <text x="42" y="78" class="s">datapath</text>
  <text x="42" y="235" class="s">control</text>

  <rect x="35" y="92" width="130" height="62" class="p"/><text x="55" y="120" class="l">input stream</text><text x="55" y="142" class="s">valid/data</text>
  <rect x="220" y="78" width="168" height="90" class="r"/><text x="248" y="110" class="l">staging reg</text><text x="242" y="134" class="s">valid_q, data_q</text>
  <polygon points="455,80 535,123 455,166" class="m"/><text x="470" y="118" class="l">byte</text><text x="468" y="137" class="l">mux</text>
  <rect x="610" y="70" width="210" height="108" class="b"/><text x="648" y="103" class="l">pack buffer</text><text x="644" y="127" class="s">pack_buffer_data_q</text><text x="644" y="148" class="s">masked byte writes</text>
  <polygon points="885,80 965,123 885,166" class="m"/><text x="898" y="118" class="l">lane</text><text x="897" y="137" class="l">mux</text>
  <rect x="1010" y="92" width="70" height="62" class="p"/><text x="1022" y="120" class="l">output</text><text x="1018" y="142" class="s">valid/data</text>

  <path d="M165 123 L220 123" class="w"/><path d="M388 123 L455 123" class="w"/><path d="M535 123 L610 123" class="w"/>
  <path d="M820 123 L885 123" class="w"/><path d="M965 123 L1010 123" class="w"/>

  <rect x="218" y="255" width="150" height="68" class="g"/><text x="252" y="284" class="l">ready logic</text><text x="240" y="305" class="s">space available</text>
  <rect x="440" y="240" width="170" height="86" class="r"/><text x="477" y="270" class="l">write pointer</text><text x="466" y="293" class="s">+ INPUT bytes</text>
  <rect x="685" y="240" width="174" height="86" class="r"/><text x="722" y="270" class="l">byte counter</text><text x="710" y="293" class="s">stored + add - remove</text>
  <polygon points="915,248 995,288 915,328" class="q"/><text x="930" y="282" class="l">count</text><text x="929" y="301" class="l">&gt;= OUT</text>

  <rect x="445" y="395" width="145" height="54" class="g"/><text x="485" y="426" class="l">mask gen</text>
  <rect x="700" y="395" width="145" height="54" class="g"/><text x="733" y="426" class="l">free bytes</text>

  <path d="M525 240 L498 166" class="c"/><path d="M518 395 L500 166" class="c"/><path d="M772 240 L772 178" class="c"/>
  <path d="M859 288 L915 288" class="c"/><path d="M995 288 L1045 288 L1045 154" class="c"/><path d="M700 422 L368 422 L368 289" class="c"/>
  <text x="35" y="486" class="s">Solid arrows are data flow. Dashed arrows are ready/valid, pointer, and counter control.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">Gearbox datapath when input width is larger than output width</title>
  <desc id="desc">Wide input stream beats are buffered, selected through a barrel output path, and emitted as narrower output stream beats.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#244766"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #16324f; }
      .label { font: 600 15px Arial, sans-serif; fill: #17324d; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .box { fill: #f8fafc; stroke: #244766; stroke-width: 2; rx: 8; }
      .state { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .logic { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 8; }
      .buffer { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
      .out { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 8; }
      .arrow { stroke: #244766; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .byte { fill: #bbf7d0; stroke: #15803d; stroke-width: 1.2; rx: 4; }
    </style>
  </defs>

  <rect width="1040" height="430" fill="#ffffff"/>
  <text x="40" y="44" class="title">INPUT_DATA_WIDTH &gt; OUTPUT_DATA_WIDTH: split wider beats into smaller beats</text>

  <rect x="40" y="95" width="165" height="95" class="box"/>
  <text x="62" y="126" class="label">Input stream</text>
  <text x="62" y="151" class="small">input_stream_valid</text>
  <text x="62" y="171" class="small">wide input_stream_data</text>

  <rect x="260" y="82" width="230" height="122" class="buffer"/>
  <text x="292" y="113" class="label">Unpack buffer</text>
  <text x="292" y="139" class="small">unpack_buffer_data_q</text>
  <text x="292" y="160" class="small">input_lane_q selects write lane</text>
  <text x="292" y="181" class="small">stored_byte_count_q</text>

  <rect x="550" y="88" width="190" height="110" class="logic"/>
  <text x="577" y="119" class="label">Byte selector</text>
  <text x="577" y="145" class="small">read_byte_pointer_q</text>
  <text x="577" y="166" class="small">select output bytes</text>

  <rect x="800" y="88" width="190" height="110" class="out"/>
  <text x="828" y="119" class="label">Output stage</text>
  <text x="828" y="145" class="small">output_stage_valid_q</text>
  <text x="828" y="166" class="small">output_stream_data</text>

  <path d="M205 142 L260 142" class="arrow"/>
  <path d="M490 142 L550 142" class="arrow"/>
  <path d="M740 142 L800 142" class="arrow"/>

  <rect x="78" y="245" width="150" height="72" class="logic"/>
  <text x="105" y="276" class="label">Input ready</text>
  <text x="98" y="300" class="small">enough free bytes</text>
  <path d="M153 245 L153 190" class="thin"/>

  <rect x="318" y="245" width="150" height="72" class="logic"/>
  <text x="342" y="276" class="label">Write lane</text>
  <text x="338" y="300" class="small">toggles on input beat</text>
  <path d="M393 245 L393 204" class="thin"/>

  <rect x="560" y="245" width="170" height="88" class="logic"/>
  <text x="585" y="276" class="label">Read pointer</text>
  <text x="582" y="300" class="small">advances by output</text>
  <text x="582" y="320" class="small">bytes per beat</text>
  <path d="M645 245 L645 198" class="thin"/>

  <rect x="812" y="245" width="158" height="72" class="logic"/>
  <text x="837" y="276" class="label">Backpressure</text>
  <text x="829" y="300" class="small">hold stage until ready</text>
  <path d="M891 245 L891 198" class="thin"/>

  <text x="48" y="365" class="label">Example byte flow</text>
  <rect x="202" y="346" width="40" height="30" class="byte"/><text x="214" y="366" class="tiny">a0</text>
  <rect x="246" y="346" width="40" height="30" class="byte"/><text x="258" y="366" class="tiny">a1</text>
  <rect x="290" y="346" width="40" height="30" class="byte"/><text x="302" y="366" class="tiny">a2</text>
  <rect x="334" y="346" width="40" height="30" class="byte"/><text x="346" y="366" class="tiny">a3</text>
  <rect x="378" y="346" width="40" height="30" class="byte"/><text x="390" y="366" class="tiny">a4</text>
  <path d="M430 361 L510 361" class="arrow"/>
  <rect x="524" y="346" width="40" height="30" class="byte"/><text x="536" y="366" class="tiny">a0</text>
  <rect x="568" y="346" width="40" height="30" class="byte"/><text x="580" y="366" class="tiny">a1</text>
  <path d="M620 361 L700 361" class="arrow"/>
  <rect x="714" y="346" width="40" height="30" class="byte"/><text x="726" y="366" class="tiny">a2</text>
  <rect x="758" y="346" width="40" height="30" class="byte"/><text x="770" y="366" class="tiny">a3</text>
  <path d="M810 361 L890 361" class="arrow"/>
  <rect x="904" y="346" width="40" height="30" class="byte"/><text x="916" y="366" class="tiny">a4</text>
  <rect x="948" y="346" width="40" height="30" class="byte"/><text x="960" y="366" class="tiny">b0</text>
</svg>
